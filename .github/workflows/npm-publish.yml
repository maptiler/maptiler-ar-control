      #     npm publish --tag next
      #   env:
      #     NODE_AUTH_TOKEN: ${{secrets.npm_token}}

      - name: Checkout CDN repo
        uses: actions/checkout@v4
        with:
          repository: "maptiler/cdn.maptiler.com"
          path: cdn

